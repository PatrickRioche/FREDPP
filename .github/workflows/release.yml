name: Publish release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier, par exemple v0.0.9"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      vscode_version: ${{ steps.version.outputs.vscode_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${RELEASE_TAG}"
          version="$(sed -nE 's/^[[:space:]]*project\(FREDPP VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          vscode_version="$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' editors/vscode/package.json | head -n 1)"

          if [ -z "${version}" ]; then
            echo "Unable to read project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [ -z "${vscode_version}" ]; then
            echo "Unable to read VS Code extension version" >&2
            exit 1
          fi

          if [ "${release_tag}" != "v${version}" ]; then
            echo "Tag ${release_tag} does not match project version v${version}" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            echo "Tag ${release_tag} does not exist in the repository" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "${release_tag}")" ]; then
            echo "The checkout does not point to tag ${release_tag}" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "Release checkout is not clean" >&2
            git status --short
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "vscode_version=${vscode_version}" >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows x64 portable ZIP
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Configure Release
        run: cmake -S . -B out/build/release-msvc -A x64 -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build out/build/release-msvc --config Release --parallel 1

      - name: Test Release
        run: ctest --test-dir out/build/release-msvc -C Release --output-on-failure

      - name: Create Windows package
        shell: pwsh
        run: ./scripts/package-release.ps1 -BuildDirectory out/build/release-msvc -OutputDirectory out/release

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/release/FREDPP-v${{ needs.validate.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  debian:
    name: Debian 13 amd64 packages
    needs: validate
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            dpkg-dev \
            file \
            g++ \
            git \
            gzip \
            ninja-build \
            tar

      - name: Verify amd64 environment
        shell: bash
        run: test "$(dpkg --print-architecture)" = "amd64"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Configure Release
        shell: bash
        run: cmake -S . -B out/build/release-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        shell: bash
        run: cmake --build out/build/release-gcc --parallel

      - name: Test Release
        shell: bash
        run: ctest --test-dir out/build/release-gcc --output-on-failure

      - name: Create Debian packages
        shell: bash
        run: bash scripts/package-release.sh out/build/release-gcc out/release

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: release-debian
          path: |
            out/release/FREDPP-v${{ needs.validate.outputs.version }}-debian13-amd64.tar.gz
            out/release/fredpp_${{ needs.validate.outputs.version }}_amd64.deb
          if-no-files-found: error

  debian_arm64:
    name: Debian 13 arm64 packages
    needs: validate
    runs-on: ubuntu-24.04-arm
    container: debian:13

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            dpkg-dev \
            file \
            g++ \
            git \
            gzip \
            ninja-build \
            tar

      - name: Verify arm64 environment
        shell: bash
        run: test "$(dpkg --print-architecture)" = "arm64"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Configure Release
        shell: bash
        run: cmake -S . -B out/build/release-gcc-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        shell: bash
        run: cmake --build out/build/release-gcc-arm64 --parallel

      - name: Test Release
        shell: bash
        run: ctest --test-dir out/build/release-gcc-arm64 --output-on-failure

      - name: Verify executable architecture
        shell: bash
        run: file out/build/release-gcc-arm64/fredpp

      - name: Create Debian packages
        shell: bash
        run: bash scripts/package-release.sh out/build/release-gcc-arm64 out/release

      - name: Upload Debian ARM64 packages
        uses: actions/upload-artifact@v4
        with:
          name: release-debian-arm64
          path: |
            out/release/FREDPP-v${{ needs.validate.outputs.version }}-debian13-arm64.tar.gz
            out/release/fredpp_${{ needs.validate.outputs.version }}_arm64.deb
          if-no-files-found: error


  macos_x64:
    name: macOS Intel x64 portable TAR.GZ
    needs: validate
    runs-on: macos-15-intel
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Verify Intel environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          sw_vers

      - name: Configure Release
        shell: bash
        run: |
          cmake -S . -B out/build/release-macos-x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        shell: bash
        run: cmake --build out/build/release-macos-x64 --parallel

      - name: Test Release
        shell: bash
        run: ctest --test-dir out/build/release-macos-x64 --output-on-failure

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          ./out/build/release-macos-x64/fredpp --version
          file out/build/release-macos-x64/fredpp
          file out/build/release-macos-x64/fredpp | grep -Fq "x86_64"

      - name: Create macOS Intel package
        shell: bash
        run: bash scripts/package-release-macos.sh out/build/release-macos-x64 out/release

      - name: Upload macOS Intel package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: out/release/FREDPP-v${{ needs.validate.outputs.version }}-macos-x64.tar.gz
          if-no-files-found: error

  macos_arm64:
    name: macOS Apple Silicon arm64 portable TAR.GZ
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Verify Apple Silicon environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Configure Release
        shell: bash
        run: |
          cmake -S . -B out/build/release-macos-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        shell: bash
        run: cmake --build out/build/release-macos-arm64 --parallel

      - name: Test Release
        shell: bash
        run: ctest --test-dir out/build/release-macos-arm64 --output-on-failure

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          ./out/build/release-macos-arm64/fredpp --version
          file out/build/release-macos-arm64/fredpp
          file out/build/release-macos-arm64/fredpp | grep -Fq "arm64"

      - name: Create macOS Apple Silicon package
        shell: bash
        run: bash scripts/package-release-macos.sh out/build/release-macos-arm64 out/release

      - name: Upload macOS Apple Silicon package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: out/release/FREDPP-v${{ needs.validate.outputs.version }}-macos-arm64.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build installable Android APK
        run: bash android/gradlew -p android :app:assembleDebug

      - name: Rename Android APK
        shell: bash
        run: |
          mkdir -p out/release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "out/release/FREDPP-v${{ needs.validate.outputs.version }}-android.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/release/FREDPP-v${{ needs.validate.outputs.version }}-android.apk
          if-no-files-found: error

  vscode:
    name: VS Code universal VSIX
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate VS Code extension JSON
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            for (const file of [
              "editors/vscode/package.json",
              "editors/vscode/language-configuration.json",
              "editors/vscode/syntaxes/fredpp.tmLanguage.json",
              "editors/vscode/snippets/fredpp.json"
            ]) JSON.parse(fs.readFileSync(file, "utf8"));
          '

      - name: Create VSIX
        shell: bash
        run: |
          mkdir -p out/release
          cd editors/vscode
          npx --yes @vscode/vsce@3.9.2 package \
            --out "../../out/release/FREDPP-Language-v${{ needs.validate.outputs.vscode_version }}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: out/release/FREDPP-Language-v${{ needs.validate.outputs.vscode_version }}.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, windows, debian, debian_arm64, macos_x64, macos_arm64, android, vscode]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: out/release
          merge-multiple: true

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd out/release
          sha256sum \
            "FREDPP-v${{ needs.validate.outputs.version }}-windows-x64.zip" \
            "FREDPP-v${{ needs.validate.outputs.version }}-debian13-amd64.tar.gz" \
            "fredpp_${{ needs.validate.outputs.version }}_amd64.deb" \
            "FREDPP-v${{ needs.validate.outputs.version }}-debian13-arm64.tar.gz" \
            "fredpp_${{ needs.validate.outputs.version }}_arm64.deb" \
            "FREDPP-v${{ needs.validate.outputs.version }}-macos-x64.tar.gz" \
            "FREDPP-v${{ needs.validate.outputs.version }}-macos-arm64.tar.gz" \
            "FREDPP-v${{ needs.validate.outputs.version }}-android.apk" \
            "FREDPP-Language-v${{ needs.validate.outputs.vscode_version }}.vsix" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "out/release/FREDPP-v${RELEASE_VERSION}-windows-x64.zip"
            "out/release/FREDPP-v${RELEASE_VERSION}-debian13-amd64.tar.gz"
            "out/release/fredpp_${RELEASE_VERSION}_amd64.deb"
            "out/release/FREDPP-v${RELEASE_VERSION}-debian13-arm64.tar.gz"
            "out/release/fredpp_${RELEASE_VERSION}_arm64.deb"
            "out/release/FREDPP-v${RELEASE_VERSION}-macos-x64.tar.gz"
            "out/release/FREDPP-v${RELEASE_VERSION}-macos-arm64.tar.gz"
            "out/release/FREDPP-v${RELEASE_VERSION}-android.apk"
            "out/release/FREDPP-Language-v${{ needs.validate.outputs.vscode_version }}.vsix"
            "out/release/SHA256SUMS.txt"
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "FREDPP ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --title "FREDPP ${RELEASE_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
