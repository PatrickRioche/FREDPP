name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag and project version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*project\(FREDPP VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "Unable to read project version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Release checkout is not clean" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 portable ZIP
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Release
        run: cmake -S . -B out/build/release-msvc -A x64 -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build out/build/release-msvc --config Release --parallel 1

      - name: Test Release
        run: ctest --test-dir out/build/release-msvc -C Release --output-on-failure

      - name: Create Windows package
        shell: pwsh
        run: ./scripts/package-release.ps1 -BuildDirectory out/build/release-msvc -OutputDirectory out/release

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/release/FREDPP-v${{ needs.validate.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  debian:
    name: Debian 13 amd64 packages
    needs: validate
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ git ninja-build dpkg-dev file tar gzip

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Release
        shell: bash
        run: cmake -S . -B out/build/release-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DFREDPP_BUILD_TESTS=ON

      - name: Build Release
        shell: bash
        run: cmake --build out/build/release-gcc --parallel

      - name: Test Release
        shell: bash
        run: ctest --test-dir out/build/release-gcc --output-on-failure

      - name: Create Debian packages
        shell: bash
        run: bash scripts/package-release.sh out/build/release-gcc out/release

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: release-debian
          path: |
            out/release/FREDPP-v${{ needs.validate.outputs.version }}-debian13-amd64.tar.gz
            out/release/fredpp_${{ needs.validate.outputs.version }}_amd64.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, windows, debian]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: out/release
          merge-multiple: true

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          cd out/release
          sha256sum \
            "FREDPP-v${{ needs.validate.outputs.version }}-windows-x64.zip" \
            "FREDPP-v${{ needs.validate.outputs.version }}-debian13-amd64.tar.gz" \
            "fredpp_${{ needs.validate.outputs.version }}_amd64.deb" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            out/release/FREDPP-v${{ needs.validate.outputs.version }}-windows-x64.zip \
            out/release/FREDPP-v${{ needs.validate.outputs.version }}-debian13-amd64.tar.gz \
            out/release/fredpp_${{ needs.validate.outputs.version }}_amd64.deb \
            out/release/SHA256SUMS.txt \
            --verify-tag \
            --title "FREDPP ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
