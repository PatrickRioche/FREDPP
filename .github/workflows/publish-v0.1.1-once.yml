# One-shot release bootstrap: triggered only when this file first lands on dev.
# GITHUB_TOKEN tag pushes do not trigger new workflows, so explicitly dispatch
# the standard existing release.yml workflow. Tag is never moved or overwritten.
name: Bootstrap FREDPP v0.1.1 prerelease

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/publish-v0.1.1-once.yml

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    name: Tag validated dev tip and dispatch official release
    if: github.repository == 'PatrickRioche/FREDPP' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact dev commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source and bundled procedure
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'project(FREDPP VERSION 0.1.1 LANGUAGES CXX)' CMakeLists.txt
          grep -Fq '"version": "0.1.1"' editors/vscode/package.json
          test -s library/ecfp.fredpp
          test -s tests/test_cli_library_ecfp.cmake
          grep -Fq 'ecfp.fredpp' RELEASE_NOTES.md
          test -s .github/workflows/release.yml
          echo "Validated release v0.1.1 at ${GITHUB_SHA}"

      - name: Create v0.1.1 tag once and dispatch the official release workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const tag = 'v0.1.1';
            const { data: branch } = await github.rest.git.getRef({
              owner, repo, ref: 'heads/dev'
            });
            if (branch.object.sha !== sha) {
              throw new Error('dev moved after this run began; refusing to tag an older commit');
            }
            let existing = null;
            try {
              const result = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tag });
              existing = result.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && existing !== sha) {
              throw new Error('Tag ' + tag + ' exists at another commit; not moving it');
            }
            if (!existing) {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/' + tag, sha
              });
              core.info('Created ' + tag + ' at ' + sha);
            } else {
              core.info(tag + ' already points to ' + sha);
            }
            // A GITHUB_TOKEN-created tag does not fire another push workflow.
            // workflow_dispatch is explicitly permitted and runs the existing
            // cross-platform release process, including its version/tag guards.
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'release.yml', ref: 'dev',
              inputs: { tag }
            });
            core.info('Dispatched official release.yml for ' + tag);
