name: Windows development checks

on:
  push:
    branches:
      - dev
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - "scripts/build.bat"
      - "scripts/test.bat"
      - "scripts/rebuild.bat"
      - "scripts/build.ps1"
      - "scripts/test.ps1"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/windows-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_msvc:
    name: Windows MSVC / focused regression
    runs-on: windows-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure MSVC x64 Release
        run: cmake -S . -B out/build/windows-dev -A x64 -DFREDPP_BUILD_TESTS=ON

      - name: Compile all FREDPP C++ targets
        run: cmake --build out/build/windows-dev --config Release --parallel 1

      # This development lane deliberately runs targeted engineering
      # regressions, not the deferred historical compatibility campaign.
      - name: Test targeted core, K-copy, ZK-insert and T-jump regressions
        run: ctest --test-dir out/build/windows-dev -C Release --output-on-failure -R "^(cli_smoke|test_version|test_release_manifest|test_flow|test_command_executor|test_command_parser|test_test_command|cli_test_condition_t|test_move|test_copy|cli_copy|test_zap_copy|cli_zap_copy|test_global|test_substitute)$"

      # Validate the same Debug entry points used on Windows 11 without
      # writing intermediate objects into the repository or runner.temp.
      - name: Build through Windows Debug script
        shell: cmd
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: call scripts\build.bat

      - name: Test through Windows Debug script
        shell: cmd
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: call scripts\test.bat -R "^(test_zap_copy|cli_zap_copy)$"
