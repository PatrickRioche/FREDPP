name: Windows development checks

on:
  push:
    branches:
      - dev
    paths:
      - "include/**"
      - "src/**"
      - "tests/**"
      - "scripts/build.bat"
      - "scripts/test.bat"
      - "scripts/rebuild.bat"
      - "scripts/build.ps1"
      - "scripts/test.ps1"
      - "CMakeLists.txt"
      - "cmake/**"
      - ".github/workflows/windows-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_msvc:
    name: Windows MSVC / full regression
    runs-on: windows-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure MSVC x64 Release
        run: cmake -S . -B out/build/windows-dev -A x64 -DFREDPP_BUILD_TESTS=ON

      - name: Compile all FREDPP C++ targets
        run: cmake --build out/build/windows-dev --config Release --parallel 1

      - name: Run complete Windows Release test suite
        run: ctest --test-dir out/build/windows-dev -C Release --output-on-failure

      # A testable Release-mode executable without publishing a GitHub Release.
      # Keep the version number unchanged until the next formal release.
      - name: Write Windows Release build identity and SHA-256
        shell: pwsh
        run: |
          $directory = "out/build/windows-dev/Release"
          $executable = Join-Path $directory "fredpp.exe"
          if (-not (Test-Path $executable)) {
            throw "Release executable not found: $executable"
          }
          $hash = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $directory "SHA256SUMS.txt") -Value "$hash  fredpp.exe" -Encoding ascii
          Set-Content -Path (Join-Path $directory "BUILD_INFO.txt") -Value @(
            "FREDPP Windows x64 development build (MSVC Release)"
            "Commit: ${{ github.sha }}"
            "Branch: ${{ github.ref_name }}"
            "Configuration: Release"
            "This artifact is not a published GitHub Release."
          ) -Encoding utf8

      - name: Upload testable Windows x64 Release executable
        uses: actions/upload-artifact@v4
        with:
          name: FREDPP-Windows-x64-Release-dev-${{ github.sha }}
          path: |
            out/build/windows-dev/Release/fredpp.exe
            out/build/windows-dev/Release/SHA256SUMS.txt
            out/build/windows-dev/Release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # This development lane deliberately runs targeted engineering
      # regressions, not the deferred historical compatibility campaign.
      - name: Test targeted core, K-copy, ZK-insert, FF, equals and T-jump regressions
        run: ctest --test-dir out/build/windows-dev -C Release --output-on-failure -R "^(cli_smoke|test_version|test_release_manifest|test_flow|test_command_executor|test_command_parser|test_test_command|cli_test_condition_t|test_move|test_copy|cli_copy|test_file_io|test_zap_copy|cli_zap_copy|test_global|test_substitute|test_facts|test_help_manager|test_line_number|cli_line_number)$"

      # Validate the same Debug entry points used on Windows 11 without
      # writing intermediate objects into the repository or runner.temp.
      - name: Build through Windows Debug script
        shell: cmd
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: call scripts\build.bat

      - name: Test through Windows Debug script
        shell: cmd
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: call scripts\test.bat

      # PowerShell must invoke the native wrapper: cmd.exe otherwise
      # interprets the alternation pipe before the .bat script can quote it.
      - name: Test regex alternation via native PowerShell wrapper
        shell: pwsh
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: .\scripts\test.ps1 -R "^(test_zap_copy|cli_zap_copy)$"

      - name: Test simple filter via batch wrapper in PowerShell
        shell: pwsh
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: .\scripts\test.bat -R zap_copy

      - name: Test historical R fallback under Windows Debug
        shell: pwsh
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: .\scripts\test.ps1 -R "^test_file_io$"

      - name: Test historical FF facts and embedded help under Windows Debug
        shell: pwsh
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: .\scripts\test.ps1 -R "^(test_facts|test_help_manager)$"

      - name: Test equals line number and help under Windows Debug
        shell: pwsh
        env:
          FREDPP_BUILD_DIR: ${{ runner.workspace }}\fredpp-debug
        run: .\scripts\test.ps1 -R "^(test_line_number|cli_line_number|test_help_manager)$"

  # Opt-in publication only for the explicitly marked v0.1.2 commit.
  # Runs after all Windows MSVC Release and Debug checks have passed.
  publish_v012:
    name: Tag and dispatch v0.1.2 pre-release after validation
    needs: windows_msvc
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v0.1.2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate dev tip and create the immutable v0.1.2 tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.1.2
          current_tip="$(gh api "repos/$GH_REPO/branches/dev" --jq '.commit.sha')"
          if [[ "$current_tip" != "$GITHUB_SHA" ]]; then
            echo "dev advanced since the CI run; refusing to tag" >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          echo "Created pre-release tag $tag at $GITHUB_SHA"

      - name: Trigger multi-platform GitHub pre-release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref dev -f tag=v0.1.2
          echo "Release workflow dispatched for v0.1.2"
